name: Wails v3 Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'timecheck-ubuntu-24.04-amd64'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'
            extra_tags: ''

          - name: 'timecheck-ubuntu-22.04-amd64'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'
            extra_tags: 'gtk3'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with Wails v3
        uses: ./.github/actions
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          extra-tags: ${{ matrix.build.extra_tags }}
          package: true
          go-version: '1.25.x'
          node-version: '22.x'
          token: ${{ secrets.GITHUB_TOKEN }}
