name: "Wails v3 Build Action"
description: "Builds a Wails v3 application using Task and Wails3 CLI"

inputs:
  build:
    description: "Whether to build"
    required: false
    default: "true"
  package:
    description: "Upload artifacts and release on tags"
    required: false
    default: "true"
  build-name:
    description: "The name of the binary file"
    required: true
  build-platform:
    description: "Platform to build for"
    required: false
    default: "linux/amd64"
  extra-tags:
    description: "Extra build tags (e.g. gtk3)"
    required: false
    default: ""
  go-version:
    description: "Version of Go to use"
    required: false
    default: "1.25.x"
  node-version:
    description: "Node.js version"
    required: false
    default: "22.x"
  token:
    description: "GitHub token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        check-latest: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config gcc build-essential

    - name: Install Task & Wails3 CLI
      shell: bash
      run: |
        go install github.com/go-task/task/v3/cmd/task@latest
        go install github.com/wailsapp/wails/v3/cmd/wails3@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Build Application with Wails v3
      shell: bash
      run: |
        EXTRA_TAGS_ARG=""
        if [ -n "${{ inputs.extra-tags }}" ]; then
          EXTRA_TAGS_ARG="EXTRA_TAGS=${{ inputs.extra-tags }}"
        fi
        task linux:build $EXTRA_TAGS_ARG OUTPUT="bin/${{ inputs.build-name }}"
        chmod +x "bin/${{ inputs.build-name }}"

        # Prepare binary for DEB packaging
        cp "bin/${{ inputs.build-name }}" bin/odoo-attendance-app

        # Adjust DEB package dependencies for gtk3 builds (Ubuntu 22.04 / Debian 12)
        if [[ "${{ inputs.extra-tags }}" == *"gtk3"* ]]; then
          sed -i 's/libgtk-4-1/libgtk-3-0/g' ./build/linux/nfpm/nfpm.yaml
          sed -i 's/libwebkitgtk-6.0-4/libwebkit2gtk-4.1-0/g' ./build/linux/nfpm/nfpm.yaml
        fi

        task linux:generate:dotdesktop
        task linux:generate:deb

        # Rename generated .deb to match build flavor
        if [ -f "bin/odoo-attendance-app.deb" ]; then
          mv "bin/odoo-attendance-app.deb" "bin/${{ inputs.build-name }}.deb"
        elif compgen -G "bin/odoo-attendance-app*.deb" > /dev/null; then
          mv bin/odoo-attendance-app*.deb "bin/${{ inputs.build-name }}.deb"
        fi

        # Restore original nfpm.yaml
        git checkout -- ./build/linux/nfpm/nfpm.yaml 2>/dev/null || true

    - name: Run Tests
      shell: bash
      run: go test -v ./...

    - name: Upload Artifacts
      if: inputs.package == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.build-name }}
        path: |
          bin/${{ inputs.build-name }}
          bin/${{ inputs.build-name }}.deb

    - name: Create Release
      if: inputs.package == 'true' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          bin/${{ inputs.build-name }}
          bin/${{ inputs.build-name }}.deb
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
