name: "Wails v3 Build Action"
description: "Builds a Wails v3 application using Task and Wails3 CLI"

inputs:
  build:
    description: "Whether to build"
    required: false
    default: "true"
  package:
    description: "Upload artifacts and release on tags"
    required: false
    default: "true"
  build-name:
    description: "The name of the binary file"
    required: true
  build-platform:
    description: "Platform to build for"
    required: false
    default: "linux/amd64"
  go-version:
    description: "Version of Go to use"
    required: false
    default: "1.25.x"
  node-version:
    description: "Node.js version"
    required: false
    default: "22.x"
  token:
    description: "GitHub token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        check-latest: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Task & Wails3 CLI
      shell: bash
      run: |
        go install github.com/go-task/task/v3/cmd/task@latest
        go install github.com/wailsapp/wails/v3/cmd/wails3@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev pkg-config gcc

    - name: Run Tests
      shell: bash
      run: go test -v ./...

    - name: Build Application with Wails v3
      shell: bash
      run: |
        task linux:build
        if [ -f "bin/timecheck" ]; then
          cp bin/timecheck "bin/${{ inputs.build-name }}"
          chmod +x "bin/${{ inputs.build-name }}"
        fi

    - name: Upload Artifacts
      if: inputs.package == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.build-name }}
        path: bin/

    - name: Create Release
      if: inputs.package == 'true' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
