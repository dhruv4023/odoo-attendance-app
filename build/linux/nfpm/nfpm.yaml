name: "timecheck"
arch: ${GOARCH}
platform: "linux"
version: "1.0.0"
section: "utils"
priority: "optional"
maintainer: "TimeCheck Maintainer <noreply@example.com>"
description: "Work schedule check-in/check-out reminder application with system tray"
vendor: "TimeCheck"
homepage: "https://github.com/your-org/timecheck"
license: "MIT"
release: "1"

contents:
  - src: "./bin/timecheck"
    dst: "/usr/bin/timecheck"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/timecheck.png"
  - src: "./build/linux/timecheck.desktop"
    dst: "/usr/share/applications/timecheck.desktop"
  - src: "./build/timecheck.service"
    dst: "/usr/lib/systemd/user/timecheck.service"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libnotify-bin

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
