name: "odoo-attendance-app"
arch: ${GOARCH}
platform: "linux"
version: "1.0.0"
section: "utils"
priority: "optional"
maintainer: "Odoo Attendance App Maintainer <dhruv20345@gmail.com>"
description: "Work schedule check-in/check-out reminder application with system tray"
vendor: "Odoo Attendance App"
homepage: https://github.com/dhruv4023/odoo-attendance-app
license: "MIT"
release: "1"

contents:
  - src: "./bin/odoo-attendance-app"
    dst: "/usr/bin/odoo-attendance-app"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/odoo-attendance-app.png"
  - src: "./build/linux/odoo-attendance-app.desktop"
    dst: "/usr/share/applications/odoo-attendance-app.desktop"
  - src: "./build/odoo-attendance-app.service"
    dst: "/usr/lib/systemd/user/odoo-attendance-app.service"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libnotify-bin

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
